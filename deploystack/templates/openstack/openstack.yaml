passwords:
  ADMIN_PASSWORD: ""
  SERVICE_PASSWORD: ""
  RABBITMQ_PASSWORD: ""
  DATABASE_PASSWORD: ""
  DEMO_PASSWORD: ""

network:
  HOST_IP: ""
  HOST_IP_NETMASK: ""
  HOST_IP_CIDR: ""
  HOST_IP_GATEWAY: ""
  HOST_DNS_SERVERS: 
  HOST_MGMT_INTERFACE: ""

  HOST_DOMAIN: ""

neutron:
  DRIVER: "ovs"           # ovs | ovn
  
  public_network:
    PUBLIC_SUBNET_CIDR: ""
    PUBLIC_SUBNET_RANGE_START: ""
    PUBLIC_SUBNET_RANGE_END: ""
    PUBLIC_SUBNET_GATEWAY: ""
    PUBLIC_SUBNET_DNS_SERVERS: ""

  # OVS-specific
  ovs:
    CREATE_BRIDGES: "yes"
    PUBLIC_BRIDGE_INTERFACE: ""
    PUBLIC_BRIDGE: "br-ex"
    TUNNEL_BRIDGE: "br-tun" # only for VXLAN networks tenant
    TENANT_BRIDGE: "br-tenant"  # only OVS, OVN manages it alone

  # OVN-specific
  ovn:
    CREATE_BRIDGES: "yes"

    OVN_NB_PORT: "6641"
    OVN_SB_PORT: "6642"

    OVN_PUBLIC_BRIDGE_INTERFACE: "" 
    OVN_PUBLIC_BRIDGE: "br-ex"

    OVN_ENCAP_TYPE: "geneve"        # geneve | vxlan

    OVN_L3_SCHEDULER: "leastloaded" # leastloaded | chance

    ENABLE_DISTRIBUTED_FLOATING_IP: "no"

  # Tenant network configuration (common to OVS and OVN)
  tenant_network:
    TYPE: "geneve"      # OVN: geneve, vxlan | OVS: flat, vlan, vxlan
    VNI_RANGE: "1:65536"

  # Configure provider networks
  provider_networks:
    - name: "public"
      bridge: "br-ex"
      type: "flat"
    # Add more if you have multiple physnets:
    # - name: "internal"
    # bridge: "br-internal"
    # type: "flat"

  default_security_group:
    defaults:
      remote_ip_prefix: "0.0.0.0/0"

    services:
      ssh:
        enabled: true
        port: 22
        protocol: tcp

      icmp:
        protocol: icmp
        enabled: true

      http:
        enabled: false
        port: 80
        protocol: tcp

      https:
        enabled: false
        port: 443
        protocol: tcp

    #rules:
    #  - direction: ingress
    #    protocol: tcp
    #    port_range: [8080, 8080]
    #    remote_ip_prefix: "0.0.0.0/0"

manila:
  # Manila backend to use.
  # generic: creates share servers using Nova service instances (more complex, multi-node)
  # lvm: exports shares directly from the storage node using LVM (simple, single-node)
  BACKEND: ""

  # Automatically create Manila shares defined in the configuration.
  # yes: creates configured shares after the backend setup is completed
  # no: only configures Manila backend without creating shares
  CREATE_SHARES: "yes"

  # Share type name that will be used as default for creating new shares
  # If not set, it will fallback to the name 'default_share_type'
  DEFAULT_SHARE_TYPE_NAME: "default_share_type"

  # Supported share protocols.
  # Examples: NFS, CIFS

  SHARE_PROTOCOLS:
    - NFS
  
  SHARE_HELPERS:
      - NFS:
          name: "manila.share.drivers.helpers.NFSHelper"
  #   - CIFS:
  #     name: "manila.share.drivers.helpers.NASHelper"

  backends:

    generic:
      BACKEND_NAME: "generic"

      SERVICE_IMAGE_NAME: "manila-service-image"

      INTERFACE_DRIVER: "manila.network.linux.interface.OVSInterfaceDriver"

      CONNECT_SHARE_SERVER_TO_TENANT_NETWORK: "yes"

      service_networks:
        - name: manila_internal_service_network
          neutron_network: internal
        - name: manila_public_service_network
          neutron_network: public

      # Nova flavor configuration for Manila service instances.
      SERVICE_INSTANCE_FLAVOR:
        NAME: "manila-service-flavor"
        ID: 10
        RAM: 1024
        VCPUS: 1
        DISK: 10

    lvm:

      samba:
        SAMBA_SERVER_USER: "samba-user"
        SAMBA_SERVER_USER_PASSWORD: ""
        
      # Backend name identifier.
      BACKEND_NAME: "lvm"

      # Manila share driver used by this backend.
      SHARE_DRIVER: "manila.share.drivers.lvm.LVMShareDriver"

      SHARE_EXPORT_IP: "172.20.10.10"

      storage:
        # -------------------------
        # Physical volume configuration
        # -------------------------

        SHARE_VOLUME_GROUP: "manila-shares"

        PHYSICAL_VOLUME: ""

        # -------------------------
        # Loopback device configuration
        # -------------------------

        MANILA_LVM_IMAGE_FILE_PATH: "/var/lib/manila/images/manila-shares.img"

        MANILA_LVM_IMAGE_SIZE_IN_GB: "10"

        MANILA_LVM_LOOP_PATH: "/dev/loop0"

  # Shares types to create automatically during deployment.
  share_types:
    - name: "default_share_type"
      is_public: yes
      extra_specs:
        - driver_handles_share_servers: no
        # - snapshot_support: no
        # - create_share_from_snapshot_support: no
        # - revert_to_snapshot_support: no
        # - mount_snapshot_support: no

    # Shares to create during deployment.
  shares:

    # Example: Generic DHSS Share
    #- name: default_share
    #  share_protocol: NFS
    #  share_size: 1
    #  is_public: yes
    #  share_network: manila_internal_service_network
    #  access_rules:
    #  - type: "ip"
    #    access: "10.0.0.0/24"
    #    level: "rw"
    #  - type: "ip"
    #    access: "10.254.0.0/28"
    #    level: "rw"

    # Example: LVM Share
    #- name: default_share
    #  share_protocol: NFS
    #  share_size: 1
    #  is_public: yes
    #  access_rules:
    #  - type: "ip"
    #    access: "10.0.0.0/24"
    #    level: "rw"
    #  - type: "ip"
    #    access: "10.254.0.0/28"
    #    level: "rw"

cinder:

  # Enable Cinder Backup service for Cinder volumes
  ENABLE_CINDER_BACKUP: no

  # Active backend(s) for cinder-volume. Each becomes a separate section
  # in cinder.conf, referenced by `enabled_backends`.

  ENABLED_BACKENDS:
  - lvm

  # Volume type used by default when no volume type is specified
  # during volume creation.
  DEFAULT_VOLUME_TYPE: "iscsi"

  backends:
    lvm:
      # Backend name, used as volume_backend_name and as
      # reference in volume types (e.g., "iscsi").
      BACKEND_NAME: "lvm"

      # Cinder volume type name associated with this backend.
      VOLUME_TYPE_NAME: "iscsi"

      # Name of the LVM volume group used by Cinder to create
      # and manage logical volumes.
      VOLUME_GROUP: "cinder-volumes"

      # --- Physical volume ---

      # Path to a real block device to use as the LVM physical volume.
      # If set, the loopback device configuration below is ignored.
      # Example: "/dev/sdb".
      PHYSICAL_VOLUME: ""

      # --- Loopback device (used only if PHYSICAL_VOLUME is not set) ---

      # Path of the loopback device used as the LVM physical volume.
      # The device is backed by the image file specified below.
      CINDER_VOLUME_LVM_PHYSICAL_PV_LOOP_PATH: "/dev/loop0"

      # Path to the disk image file used as backing storage for the
      # loopback LVM physical volume.
      CINDER_VOLUME_LVM_IMAGE_FILE_PATH: "/var/lib/cinder/cinder-volumes.img"

      # Size of the loopback image file in GB.
      # This determines the total capacity available to the LVM backend.
      CINDER_VOLUME_LVM_IMAGE_SIZE_IN_GB: "5"

      # IP address of the iSCSI target used to expose Cinder LVM volumes.
      # If left empty, the value of network.HOST_IP is used.
      TARGET_IP_ADDRESS: ""

      # Volume clearing strategy when a volume is deleted
      # Options: zero (overwrite with zeros), shred (secure erase), none (skip, faster for testing)
      VOLUME_CLEAR: "zero"

      # Amount of data to clear in MB (0 = entire volume)
      VOLUME_CLEAR_SIZE: 1

    nfs:
      # Backend name, used as volume_backend_name and as
      # reference in volume types (e.g., "nfs")
      BACKEND_NAME: "nfs"

      # Cinder volume type name associated with this backend.
      VOLUME_TYPE_NAME: "nfs"

      # Whether to use an existing NFS share provided by an external
      # NFS server. If no, the system manages the NFS share locally.
      USE_EXTERNAL_SHARE: "no"

      # NFS export used to store Cinder volumes as image files.
      # Format: <NFS-server>:<export-path>
      # (e.g., 172.20.10.10:/export/cinder-volumes).
      NFS_SHARE: ""

      # Local directory on the cinder-volume host where the NFS
      # share is mounted and used to store Cinder volume files.
      MOUNT_POINT_BASE: "/var/lib/cinder/mnt"

      # Optional mount options passed to the NFS mount command
      # (e.g., "vers=4.1"). Leave empty to use the system defaults.
      MOUNT_OPTIONS: ""

      # Controls whether Cinder creates sparse volume files.
      # Use "sparse" to create sparse files, or "thick" to
      # allocate the full volume size on the NFS share.
      NFS_SPARSED_VOLUMES: "sparse"

      # Maximum fraction of the NFS backend capacity that can be
      # allocated by Cinder. For example, 0.95 allows allocation
      # up to 95% of the reported backend capacity.
      NFS_USED_RATIO: 0.95

      # Maximum over-subscription ratio for the NFS backend.
      # Controls how much virtual capacity can be provisioned compared to
      # the physical capacity reported by the backend.
      # 1.0 means no over-subscription is allowed.
      NFS_OVERSUB_RATIO: 1.0

      # Controls whether snapshot support is enabled for the Cinder NFS driver.
      # Set to "yes" to enable volume snapshots, or "no" to disable them.
      ENABLE_SNAPSHOTS: "yes"

  backup:

    # Cinder backup driver to use.
    # Supported drivers: posix | nfs | swift (future).
    DRIVER: ""

    drivers:

      # --- Driver: posix ---
      # Backup to a local filesystem or a filesystem mounted on the
      # cinder-backup host.

      posix:
        # Directory where Cinder backup files are stored.
        BACKUP_PATH: "/var/lib/cinder/backups"

      # --- Driver: nfs ---
      nfs:
        # Whether to use an existing NFS share provided by an external
        # NFS server. If no, the system manages the NFS share locally.
        USE_EXTERNAL_SHARE: "no"

        # NFS export used to store Cinder backup files.
        # Format: <NFS-server>:<export-path>
        # Example: "{network.HOST_IP}:/export/cinder-backups".
        NFS_SHARE: ""

        # Local directory on the cinder-backup host where the NFS
        # share is mounted and used to store Cinder backup files.
        MOUNT_POINT_BASE: "/var/lib/cinder/cinder/backup"

        # Optional mount options passed to the NFS mount command.
        # Example: "vers=4.1".
        MOUNT_OPTIONS: ""

    # Backup compression algorithm
    # zlib | bz2 | zstd | none
    COMPRESSION_ALGORITHM: "zlib"

    # Maximum size of each backup file in bytes (Default: 1999994880)
    BACKUP_FILE_SIZE: 1999994880 

    # Block size in bytes used for SHA checksum calculation (Default: 32768)
    BACKUP_SHA_BLOCK_SIZE_BYTES: 32768

    # Number of concurrent backup operations
    BACKUP_WORKERS: 1

